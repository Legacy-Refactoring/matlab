services:
  db:
    image: postgres:17
    container_name: legacy_db
    environment:
      POSTGRES_DB: legacy_payments
      POSTGRES_USER: legacy_user
      POSTGRES_PASSWORD: legacy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seeder.sql:/docker-entrypoint-initdb.d/02-seeder.sql:ro

  matlab:
    image: mathworks/matlab:r2024b
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://legacy_user:legacy_password@db:5432/legacy_payments
    ports:
      - "8888:8888"

volumes:
  postgres_data: